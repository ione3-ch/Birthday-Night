<style>

*{box-sizing:border-box}

    border-radius:34px;box-shadow:0 0 0 2px #2a2540,0 20px 60px rgba(0,0,0,.6)}
}

  text-shadow:0 0 6px rgba(var(--acc-rgb),.9),0 0 14px rgba(var(--acc-rgb),.55)}

.hearts.hurt{animation:hurt .4s}

.hidden{display:none!important}

.primary{display:block;width:100%;margin-top:18px;border:0;border-radius:16px;padding:17px;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 6px 24px rgba(180,75,255,.45);

.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:var(--g)!important}

#menu{flex-direction:column;align-items:stretch;justify-content:flex-end}
.topBar{position:absolute;top:calc(8px + max(env(safe-area-inset-top,0px),var(--st,0px)));left:var(--m);right:var(--m);z-index:4;display:flex;align-items:center;gap:6px;
  padding:6px 6px 6px 6px;background:linear-gradient(180deg,rgba(14,10,34,.86),rgba(14,10,34,.6));border:1px solid rgba(var(--acc-rgb),.45);border-radius:18px;

.player{display:flex;align-items:center;gap:8px;flex:1;min-width:0}

.tv{flex:1;min-width:0;height:40px;padding:3px;border-radius:9px;background:linear-gradient(180deg,#2a2440,#120e22);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 0 0 1px rgba(var(--acc-rgb),.45),0 0 12px rgba(var(--acc-rgb),.25);position:relative}

.pill{flex:none;display:flex;align-items:center;gap:4px;height:32px;padding:0 3px 0 6px;border-radius:10px;background:rgba(10,7,26,.8);border:1px solid rgba(var(--acc-rgb),.5)}
.pill svg{width:18px;height:18px}
.pill b{font:600 13px/1 'Exo 2',sans-serif;color:#fff;min-width:14px;text-align:center}

.topBar .gear{position:static;flex:none;width:44px;height:44px;border-radius:12px}
.gameTitle{position:absolute;top:calc(88px + max(env(safe-area-inset-top,0px),var(--st,0px)));left:0;right:0;margin:0;text-align:center;pointer-events:none;color:var(--accent-2)}

  clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c));z-index:-1}

#app .sheet.panel>div{position:relative;z-index:1}
#app .sheet.panel #freeList,#app .sheet.panel #achList{max-height:min(46vh,380px);overflow:auto}
.tabHead{position:relative;z-index:0;--c:10px;display:flex;align-items:center;gap:12px;width:max-content;max-width:100%;margin:-2px 0 12px 0;padding:10px 18px 10px 14px;white-space:nowrap;
  font:700 15px/1 'Exo 2',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2);text-shadow:0 0 6px var(--accent),0 0 12px rgba(var(--acc-rgb),.6)}
.tabHead>span:not(.tabIco):not(.dot){overflow:hidden;text-overflow:ellipsis}
.tabHead::before{background:linear-gradient(90deg,rgba(var(--acc-rgb),.95),rgba(var(--acc-rgb),.25))}

  text-shadow:0 0 6px var(--accent),0 0 12px rgba(var(--acc-rgb),.6)}

  background:linear-gradient(180deg,rgba(14,10,34,.92),rgba(8,6,20,.98));border-top:1px solid rgba(var(--acc-rgb),.5);box-shadow:0 -6px 20px rgba(var(--acc-rgb),.18)}

/* ---------- transitions ---------- */
.gameTitle{transition:translate .5s cubic-bezier(.5,-0.3,.6,1),opacity .4s}
#menu.titleUp .gameTitle{translate:0 -260px;opacity:0;transition:translate .6s cubic-bezier(.45,-0.25,.75,.2),opacity .2s .45s}

@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetDown{to{transform:translateY(60px);opacity:0}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes dropIn{from{transform:translateY(-18px);opacity:0}}
@keyframes liftOut{to{transform:translateY(-18px);opacity:0}}
@keyframes titleIn{from{transform:scale(.85);opacity:0;filter:blur(4px)}}
@keyframes vinF{from{transform:translateX(28px);opacity:0}}
@keyframes vinB{from{transform:translateX(-28px);opacity:0}}

  #menu:not(.hidden) .gameTitle{animation:titleIn .6s .1s cubic-bezier(.2,.9,.3,1) both}
  #menu.leaving .sheet{animation:sheetDown .36s cubic-bezier(.5,0,.8,.4) forwards}
  #menu.leaving .topBar{animation:liftOut .32s ease-in forwards}
  #menu.leaving .gameTitle{animation:fadeOut .3s ease-in forwards}
  #settings:not(.hidden){animation:fadeIn .25s both}
  #settings.closing{animation:fadeOut .26s forwards}
  #settings.closing .sheet{animation:sheetDown .26s ease-in forwards}
  #hud:not(.hidden) .topBar{animation:dropIn .45s cubic-bezier(.2,.9,.3,1) both}
  .vin-f{animation:vinF .34s cubic-bezier(.2,.8,.2,1) both}
  .vin-b{animation:vinB .34s cubic-bezier(.2,.8,.2,1) both}
  .vin-f .pick,.vin-b .pick{animation:popIn .4s cubic-bezier(.2,.9,.3,1.2) both}

  .vin-f .pick:nth-child(5),.vin-b .pick:nth-child(5){animation-delay:.16s}
  .vin-f .pick:nth-child(n+6),.vin-b .pick:nth-child(n+6){animation-delay:.2s}
  .toast:not(.hidden){animation:toastIn .3s both}
}

/* Beat Saber style: blocks fly out of a neon tunnel and reach their frame (hit plane) after APP seconds */
let APP=2.1; const BLUE='#2d8cff', RED='#ff3b5c';
/* stage on top, slicing tunnel below with a single hit frame in the middle */
function saberGeo(){ const y0=FR?FR.panel.y:H/3, bot=FR?FR.panel.y+FR.panel.h:H, th=bot-y0, size=Math.round(Math.min(W*0.56,th*0.32,230)), c=W/2;
  /* vanishing point sits behind the stage edge so the long flight keeps a gap between cubes */
  const hy=y0+th*0.63, r=0.14, vpy=FR?(y0-r*hy)/(1-r):y0-40;   /* vanishing point just above the frame: cubes enter tiny (≈14% size) and grow to the cut zone; ZR keeps the spawn itself hidden */   /* spawn point hides behind the dancer: cubes fly in over the field's top edge */
  return {y0,size,vpx:c,vpy,hy,lx:[c,c,c],bottom:bot}; }
function proj(G2,lane,d){ /* front face of the cube when it is d seconds from the hit plane */
  const c=cam(G2), z=cubeZ(d), zf=z-0.5;
  return {x:G2.vpx, y:G2.vpy+c.f*c.camY/z, s:c.f/zf};
}
/* real 3D: a camera above the track; cubes (1 unit) travel along z towards it.
   At the hit plane (z=ZH) the front face is exactly the frame size and sits on the frame. */
const ZH=5, ZR=10; /* hit depth, and how much farther the spawn point is */
function cam(G2){ const f=G2.size*(ZH-0.5); return {f, camY:(G2.hy-G2.vpy)*ZH/f}; }
function cubeZ(d){ return Math.max(1.3, ZH*(1+(ZR-1)*d/APP)); }
function P3(G2,c,x,y,z){ return [G2.vpx+c.f*x/z, G2.vpy+c.f*(c.camY-y)/z]; }
const appBeats=()=>APP/G.spb;

function rng(seed){ return ()=>{ seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
/* one note per beat at most; mostly every 2 beats on easy; a 2-beat rest every 16 beats */
function buildChart(n,li,seed,spb){
  const r=rng(seed), out=[]; let b=0;
  while(b<n-1){
    if(b%16>=14){ b=Math.ceil((b+1)/16)*16; continue; }
    let mv; do{ mv=NOTE_MV[r()*5|0]; }while(out.length>=2&&out[out.length-1].mv===mv&&out[out.length-2].mv===mv);
    const lane=mv==='shootL'?(r()<0.7?0:1):mv==='shootR'?(r()<0.7?2:1):(r()*3|0);
    out.push({beat:b,mv,st:0,lane});
    b+=(r()<DIFF[li].one&&spb>=0.55)?1:2;   /* one block per beat most of the time */
  }
  return out;
}

let ac=null, master=null, noiseBuf=null;
function initAudio(){
  if(!ac){
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const comp=ac.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=3;
    master=ac.createGain(); master.gain.value=0.85; master.connect(comp); comp.connect(ac.destination); applySound();
    noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  }
  if(ac.state==='suspended') ac.resume();
}

function env(g,t,peak,att,dec){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+att+dec);}
function kick(bus,t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+0.14);env(g,t,0.95,0.004,0.42);o.connect(g);g.connect(bus);o.start(t);o.stop(t+0.5);}

function hat(bus,t,open,v=1){noise(bus,t,'highpass',7500,0.5,(open?0.15:0.11)*v,open?0.2:0.045);}
function tone(bus,t,type,f,dur,peak,cut){const o=ac.createOscillator();o.type=type;o.frequency.value=f;const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+0.01);g.gain.setValueAtTime(peak,t+dur*0.7);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(fl);fl.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+0.05);}

function scheduleStep(i,t){
  const T=G.track,bus=G.bus,sd=G.spb/4,bar=Math.floor(i/16),s=i%16;
  if(bar===0){ if(s%4===0) click(bus,t,s===0); if(s%2===0) hat(bus,t,false,0.8); return; }
  const b=bar-1, [off,minor]=T.prog[b%4], cr=T.root+off, brk=(b===15), fill=(b%8===7);
  if(!brk && T.kick.includes(s)) kick(bus,t);
  if(s===4||s===12) snare(bus,t);
  if(fill && !brk && s>=13) snare(bus,t,0.45);
  if(brk && s>=8 && s%2===0) snare(bus,t,0.35+(s-8)*0.08);
  if(s%2===0) hat(bus,t,s===14); else if(T.hat16) hat(bus,t,false,0.6);
  if(!brk) for(const [st,iv,len] of T.bass) if(st===s) tone(bus,t,'sawtooth',mtof(cr-12+iv),len*sd*0.95,0.3,420);
  if(s===0){ const th=minor?3:4; [0,th,7].forEach(x=>pad(bus,t,mtof(cr+12+x),16*sd)); }
  if(((b>=8&&b<15)||(b>=24&&b<31)) && b%2===0) for(const [st,pi] of LEAD) if(st===s) tone(bus,t,'square',mtof(T.root+24+PENT[pi]),sd*1.6,0.05,1800);
}
function pump(){
  if(!ac||!G.bus) return;
  const sd=G.spb/4;
  while(G.nextT<ac.currentTime+0.12 && G.step<G.totalSteps){ scheduleStep(G.step,G.nextT); G.step++; G.nextT+=sd; }
}
function stopBus(){
  if(G.src){ try{ G.src.stop(ac.currentTime+0.1); }catch(e){} G.src=null; }
  if(G.bus&&ac){ const b=G.bus; b.gain.setValueAtTime(b.gain.value,ac.currentTime); b.gain.linearRampToValueAtTime(0,ac.currentTime+0.08); setTimeout(()=>{try{b.disconnect();}catch(e){}},200); }
  G.bus=null;

const MM_CH=[[57,0],[53,1],[48,1],[55,1]];   /* Am – F – C – G */
function mmVoice(dst,t,type,f,dur,peak,cut,res,det){   /* one synth voice: osc → resonant lowpass with a plucky envelope */

  const fl=ac.createBiquadFilter(); fl.type='lowpass'; fl.Q.value=res||1; fl.frequency.setValueAtTime(cut*2.2,t); fl.frequency.exponentialRampToValueAtTime(Math.max(80,cut*0.6),t+dur);

  o.connect(fl); fl.connect(g); g.connect(dst); o.start(t); o.stop(t+dur+0.05);
}
function clubKick(dst,t,v=1){ const o=ac.createOscillator(),g=ac.createGain(); o.frequency.setValueAtTime(155,t); o.frequency.exponentialRampToValueAtTime(48,t+0.09); o.frequency.exponentialRampToValueAtTime(38,t+0.35);

function clap(dst,t,v=1){ for(const d of [0,0.011,0.022]) noise(dst,t+d,'bandpass',1350,1.1,0.42*v,d===0.022?0.17:0.03); }
function mmStep(i,t){
  const b=MM.bus, s=i%16, bar=Math.floor(i/16)%16, [root,maj]=MM_CH[bar%4], sd=MM.spb/4;
  const intro=bar<2, build=bar===7||bar===15, drop=(bar>=8&&bar<15);
  // sidechain: everything melodic ducks on each kick ("pumping")
  if(s%4===0&&!(build&&s>=8)){ clubKick(b,t,1); const d=MM.duck.gain; d.cancelScheduledValues(t); d.setValueAtTime(0.18,t); d.linearRampToValueAtTime(1,t+MM.spb*0.85); }
  if(build&&s>=8) clubKick(b,t,0.55+((s-8)/8)*0.45);   // 16th kick roll into the drop
  if(!intro&&(s===4||s===12)) clap(b,t);
  if(s%4===2) hat(b,t,true,0.7); else if(!intro) hat(b,t,false,s%2?0.35:0.5);
  if(drop&&s%2===1) noise(b,t,'highpass',9000,0.5,0.05,0.02);   // shaker
  const m=MM.mel;
  // rolling offbeat bass
  if(!intro&&(s%4===2||s%4===3)) mmVoice(m,t,'sawtooth',mtof(root-24),sd*0.9,0.28,drop?520:300,6);
  // stab chords: off-beat in the verse, big supersaw on the drop
  const th=maj?4:3, ch=[0,th,7,12];
  if(!intro&&!drop&&(s===2||s===10)) ch.forEach(x=>mmVoice(m,t,'sawtooth',mtof(root+x),sd*1.4,0.045,1400,3));
  if(drop&&[0,3,6,10,12].includes(s)) ch.forEach(x=>{ mmVoice(m,t,'sawtooth',mtof(root+x),sd*1.6,0.05,2600,2,-12); mmVoice(m,t,'sawtooth',mtof(root+x),sd*1.6,0.05,2600,2,12); });

  if(bar>=4&&bar<8&&s%2===0){ const arp=[0,7,12,th,7,12+th,12,7][(s/2)|0]; mmVoice(m,t,'square',mtof(root+12+arp),sd*0.9,0.04,3200,4); }

  if(build){ if(s===0){ const n=ac.createBufferSource(); n.buffer=noiseBuf; n.loop=true; const f=ac.createBiquadFilter(); f.type='bandpass'; f.Q.value=2; f.frequency.setValueAtTime(400,t); f.frequency.exponentialRampToValueAtTime(7000,t+MM.spb*4);

    if(s>=8) noise(b,t,'bandpass',1800,0.9,0.12+0.03*(s-8),0.06); }

}

function djFrame(f){
  const key=THT()+f; if(DJF[key]) return DJF[key];
  const c=document.createElement('canvas'); c.width=DJA_C.w; c.height=DJA_C.h; const g=c.getContext('2d');
  g.drawImage(DJA,f*DJA_C.w,0,DJA_C.w,DJA_C.h,0,0,DJA_C.w,DJA_C.h);
  g.globalCompositeOperation='color'; g.globalAlpha=0.3; g.fillStyle=THT(); g.fillRect(0,0,c.width,c.height);
  g.globalAlpha=1; g.globalCompositeOperation='multiply';
  const lg=g.createLinearGradient(0,0,0,c.height); lg.addColorStop(0,'#e6d6ff'); lg.addColorStop(0.55,'#b9a6e6'); lg.addColorStop(1,'#9c8ccc');
  g.fillStyle=lg; g.fillRect(0,0,c.width,c.height);
  g.globalCompositeOperation='destination-in'; g.drawImage(DJA,f*DJA_C.w,0,DJA_C.w,DJA_C.h,0,0,DJA_C.w,DJA_C.h);

}

function drawStage(t,bp){
  const sh=stageH(), gy=groundY(), ch=G.char, pos=bp, sup=G.state==='play'&&superActive(pos), DX=FR?FR.X(SPOT.x):W/2;
  const ph=((bp%1)+1)%1, pulse=Math.pow(1-ph,4);

  drawBooth(t,bp,pulse);
  // spotlight
  const spCol=sup?`hsla(${(t*240)%360},95%,60%,`:fieldOK?'rgba('+rgbOf(TH())+',':hexA(ch.hoodie), spR=fieldOK?W*0.3:W*0.42;
  const sp=cx.createRadialGradient(DX,gy,4,DX,gy,spR);
  sp.addColorStop(0,spCol+(0.32+0.25*pulse)+')'); sp.addColorStop(1,spCol+'0)');
  cx.fillStyle=sp; cx.beginPath(); cx.ellipse(DX,gy,spR,fieldOK?spR*0.3:(sh-gy)*1.2,0,0,Math.PI*2); cx.fill();
  // crowd
  const u=sh*0.062, hype=Math.min(1,(G.meter||0)/100+(G.combo||0)/30+(sup?1:0));
  G.crowdJump*=0.9;
  const spots=clubOK?[0.04,0.13,0.22,0.31]:[0.06,0.17,0.28,0.72,0.83,0.94], inGame=['play','pause','outro','results'].includes(G.state);
  const nVis=!inGame?spots.length:(G.result&&G.result.failed)?0:Math.max(1,Math.round(spots.length*G.lives/G.maxLives));
  const vis=new Set((clubOK?[3,2,1,0]:[2,3,1,4,0,5]).slice(0,nVis));
  spots.forEach((fx,i)=>{
    if(FR||!vis.has(i)) return;
    const x=W*fx, j=(G.crowdJump*(0.6+0.4*Math.sin(i*2.3)))*u*0.9+pulse*u*0.12*hype, base=gy+u*0.2-j, s=0.85+((i*7)%3)*0.08;
    cx.fillStyle=fieldOK?'rgba(10,7,22,.88)':'#0b0912';
    cx.beginPath(); cx.roundRect?cx.roundRect(x-u*1.1*s,base-u*2.2*s,u*2.2*s,u*2.6*s,u*0.9):cx.rect(x-u*1.1*s,base-u*2.2*s,u*2.2*s,u*2.6*s); cx.fill();
    cx.beginPath(); cx.arc(x,base-u*2.8*s,u*0.62*s,0,Math.PI*2); cx.fill();
    if(hype>0.25||G.state==='menu'&&i%2){
      const px=x+(i%2?u*0.7:-u*0.7)*s, py=base-u*3.9*s;
      cx.strokeStyle='#0b0912'; cx.lineWidth=u*0.32; cx.lineCap='round'; cx.beginPath(); cx.moveTo(x+(i%2?u*0.5:-u*0.5)*s,base-u*1.9*s); cx.lineTo(px,py+u*0.3); cx.stroke();
      const fl=sup&&Math.random()<0.08;
      cx.fillStyle=fl?'#ffffff':'rgba(190,240,255,'+(0.55+0.4*pulse)+')';
      if(fl){cx.save();cx.shadowColor='#fff';cx.shadowBlur=30;}
      cx.fillRect(px-u*0.22,py-u*0.36,u*0.44,u*0.72);
      if(fl) cx.restore();
    }
  });
  // dancer
  const du=FR?SPOT.h*FR.k/5.4:sh*0.085;
  let sx=1; if(t-G.spin<G.spb){const pr=(t-G.spin)/G.spb; sx=Math.cos(pr*Math.PI*2);} 
  cx.fillStyle='rgba(0,0,0,.45)'; cx.beginPath(); cx.ellipse(DX+cur.sway*du*0.1,gy+du*0.2,du*1.7,du*0.32,0,0,Math.PI*2); cx.fill();
  if(SPIMG[ch.id]) drawSprite(SPIMG[ch.id],t,bp,DX,gy+du*0.15,du,sx,sup,ch.spec||SP); else drawDancer(cur,ch,DX,gy+du*0.15,du,sx,sup);
  // sparks
  for(const p of G.sparks){ const a=1-p.life/p.max; cx.fillStyle=p.c; cx.globalAlpha=Math.max(0,a); cx.fillRect(DX+p.x-2,(FR?gy-du*3:sh*0.45)+p.y-2,4,4); }
  cx.globalAlpha=1;
  // graffiti burst
  if(G.burst>0.01){   /* hype word: a neon plate in the style of the menu tabs */
    const k=1-G.burst, pop=k<0.12?0.8+k/0.12*0.28:1.08-0.08*Math.min(1,(k-0.12)/0.2), al=k<0.7?1:1-(k-0.7)/0.3;

    const tw=cx.measureText(wd).width, pw=tw+fs*1.6, ph=fs*1.75, c=fs*0.42, x0=-pw/2, y0=-ph/2, tr=rgbOf(TH());
    cx.beginPath(); cx.moveTo(x0+c,y0); cx.lineTo(x0+pw,y0); cx.lineTo(x0+pw,y0+ph-c); cx.lineTo(x0+pw-c,y0+ph); cx.lineTo(x0,y0+ph); cx.lineTo(x0,y0+c); cx.closePath();
    cx.fillStyle='rgba(13,9,32,.88)'; cx.fill(); cx.shadowColor=TH(); cx.shadowBlur=18; cx.strokeStyle='rgba('+tr+',.95)'; cx.lineWidth=2; cx.stroke();

    cx.fillStyle='rgba(255,255,255,.12)'; rr(mx-6,my0,12,mh,6); cx.fill();
    const fh=mh*Math.max(0,Math.min(1,val/100));
    const mg=cx.createLinearGradient(0,my1,0,my0); mg.addColorStop(0,'#ff3d7f'); mg.addColorStop(1,'#ffb627');
    cx.fillStyle=mg; if(fh>1){ rr(mx-6,my1-fh,12,fh,6); cx.fill(); }
    if(G.meter>=100&&!sup){ cx.save(); cx.shadowColor='#ffb627'; cx.shadowBlur=18+10*pulse; cx.strokeStyle='#ffb627'; cx.lineWidth=2; rr(mx-6,my0,12,mh,6); cx.stroke(); cx.restore(); }
    cx.fillStyle='rgba(255,255,255,.7)'; cx.font='500 11px "Exo 2", sans-serif'; cx.textAlign='center'; cx.fillText(sup?'×2':'⚡',mx,my0-8);
  }
  // countdown
  if(G.state==='play'&&bp<0.5&&bp>-4.5){
    const n=Math.round(bp); const lab={'-4':'3','-3':'2','-2':'1','-1':'Танцуй!','0':'Танцуй!'}[n];
    if(lab){ const f=1-Math.abs(bp-n), fs=Math.round(lab.length>1?Math.min(30,W*0.075):Math.min(64,W*0.16)); cx.save(); cx.globalAlpha=Math.max(0,f);
      cx.font='800 '+fs+'px "Exo 2", sans-serif'; if('letterSpacing' in cx) cx.letterSpacing=(lab.length>1?Math.round(fs*0.16):0)+'px';
      cx.textAlign='center'; cx.textBaseline='middle'; cx.fillStyle=lighten(TH(),0.5); cx.shadowColor=TH(); cx.shadowBlur=18;
      const L=lab.length>1?lab.toUpperCase():lab; cx.fillText(L,W/2,hypeY(sh)); cx.shadowBlur=6; cx.fillText(L,W/2,hypeY(sh)); cx.restore(); }
  }
  // texts
  for(const tx of G.texts){
    const a=1-tx.life/tx.max, y=sh*(0.23+tx.slot*0.055)-tx.life*30;
    cx.globalAlpha=Math.max(0,Math.min(1,a*1.6)); cx.textAlign='center';
    cx.font=(tx.slot===0?'600 ':'500 ')+(tx.slot===0?Math.round(W*0.075):Math.round(W*0.045))+'px "Exo 2", sans-serif';
    cx.lineWidth=5; cx.strokeStyle='rgba(15,10,25,.8)'; cx.strokeText(tx.txt,W/2,y); cx.fillStyle=tx.color; cx.fillText(tx.txt,W/2,y);
  }
  cx.globalAlpha=1;
  drawShout(t);
}

  cx.fillStyle='#ffb627'; cx.beginPath(); cx.arc(x,y+1.32*s,0.13*s,0,Math.PI*2); cx.fill();

  cx.fillStyle='#ff3d7f'; cx.beginPath(); cx.arc(x,hy-0.1*s,0.76*s,Math.PI*1.02,Math.PI*1.98); cx.closePath(); cx.fill();
  rr(x-1.08*s,hy-0.22*s,0.5*s,0.16*s,0.06*s); cx.fill();

  cx.lineWidth=0.06*s; cx.fillStyle='#2de1fc';

  cx.fillRect(x-0.1*s,hy-0.09*s,0.2*s,0.06*s);

  if(o.talk>0){ cx.fillStyle='#5a1d2a'; cx.beginPath(); cx.ellipse(x,hy+0.4*s,0.2*s,0.05*s+0.13*s*o.talk,0,0,Math.PI*2); cx.fill(); }
  else { cx.strokeStyle='#5a1d2a'; cx.lineWidth=0.07*s; cx.beginPath(); cx.arc(x,hy+0.24*s,0.22*s,0.2*Math.PI,0.8*Math.PI); cx.stroke(); }
  cx.restore();

function drawBooth(t,bp,pulse){
  if(FR){ const r=drawDJOnField(FR.X,FR.Y,FR.k,bp); G.djA=r?{x:r.x+r.w*0.25,y:r.y+r.h*0.12}:{x:FR.X(560),y:FR.Y(200)}; return; }

    const F=fieldGeo(), r=drawDJOnField(F.X,y=>F.Y(y)-STAGE_TOP,F.k,bp);
    G.djA=r?{x:r.x+r.w*0.25,y:r.y+r.h*0.12}:{x:F.X(560),y:F.Y(200)-STAGE_TOP}; return;
  }
  if(clubOK){ /* animated DJ at the club's own console */
    const k=clubMap(0,0)[2], X=x=>clubMap(x,0)[0], Y=y=>clubMap(0,y)[1];
    const r=drawDJAnim(X,Y,k,bp);
    G.djA=r?{x:r.x+r.w*0.25,y:r.y+r.h*0.12}:{x:X(640),y:Y(560)}; return;
  }

  const shout=t<G.dj.until, arm=shout&&G.dj.arm, live=G.state!=='outro'&&G.state!=='results';
  drawDJFigure(hx,hy,s,{nod:live?pulse:0,talk:shout?0.5+0.5*Math.sin(t*22):0,armUp:arm});
  cx.fillStyle='#2d2640'; rr(bx,by-0.32*s,bw,0.4*s,0.12*s); cx.fill();

    cx.fillStyle='#0c0a12'; cx.beginPath(); cx.ellipse(tx,by-0.14*s,bw*0.17,0.24*s,0,0,Math.PI*2); cx.fill();
    cx.fillStyle='#ff3d7f'; cx.beginPath(); cx.arc(tx+Math.cos(a)*bw*0.11,by-0.14*s+Math.sin(a)*0.15*s,0.07*s,0,Math.PI*2); cx.fill();
  }

  cx.fillStyle='#17131f'; rr(bx,by+0.08*s,bw,ph,0.18*s); cx.fill();

  cx.save(); cx.font='600 '+Math.round(1.25*s)+'px "Exo 2", sans-serif'; cx.textAlign='center'; cx.textBaseline='middle';
  cx.shadowColor='#ff3d7f'; cx.shadowBlur=10+8*pulse; cx.fillStyle='#ffd1e2'; cx.fillText('DJ',hx,by+0.08*s+ph*0.6); cx.restore();
  G.djA={x:hx+0.75*s,y:hy-0.7*s};
}
function drawShout(t){
  if(t>=G.dj.until||!G.djA||G.talk) return;
  const a=Math.max(0,Math.min(1,(G.dj.until-t)*5,(t-G.dj.t0)*8));
  cx.save(); cx.globalAlpha=a; cx.font='21px "Exo 2", cursive';
  const pw=cx.measureText(G.dj.say).width+26, ph=36;
  const right=G.djA.x>W/2; /* DJ on the right: bubble opens to the left */
  let x=right?G.djA.x-pw+6:G.djA.x+14, y=Math.max(SAFE_T+(FR?68:4),G.djA.y-ph-10);
  x=Math.max(8,Math.min(x,W-8-pw));
  const t1=right?x+pw-34:x+14, t2=t1+18;
  cx.fillStyle='#fff'; cx.strokeStyle='#14101e'; cx.lineWidth=2.5;
  rr(x,y,pw,ph,14); cx.fill(); cx.stroke();
  cx.beginPath(); cx.moveTo(t1,y+ph-1.5); cx.lineTo(G.djA.x,G.djA.y); cx.lineTo(t2,y+ph-1.5); cx.closePath(); cx.fill();
  cx.beginPath(); cx.moveTo(t1,y+ph); cx.lineTo(G.djA.x,G.djA.y); cx.lineTo(t2,y+ph); cx.stroke();
  cx.fillStyle='#14101e'; cx.textAlign='left'; cx.textBaseline='middle'; cx.fillText(G.dj.say,x+13,y+ph/2+1);
  cx.restore();
}
function drawLives(t){
  if(FR||!['play','pause','outro'].includes(G.state)) return;
  cx.save(); cx.font='20px system-ui, sans-serif'; cx.textBaseline='middle'; cx.textAlign='left';
  const shake=t-G.hurt<0.4?Math.sin((t-G.hurt)*60)*3*(1-(t-G.hurt)/0.4):0;
  for(let i=0;i<G.maxLives;i++){
    const on=i<G.lives, lost=i===G.lives&&t-G.hurt<0.4;
    cx.fillStyle=on?'#ff3d7f':lost?'#ffffff':'rgba(255,255,255,.18)';
    cx.fillText('♥',14+i*24+(lost?shake:0),H/3+20);
  }
  cx.restore();
}
function drawDJBig(t){

  const typing=talkShown()<T.text.length;

    const P=djPortraitSize(), bob=typing?Math.sin(t*18)*2:0, shake=T.emo==='angry'&&typing?Math.sin(t*55)*2:0;
    const x=W/2-P.w/2+shake, y=H-P.h+(1-e)*P.h*0.6+bob;
    cx.save(); cx.imageSmoothingEnabled=P.w<DJC.w; cx.shadowColor='#b44bff'; cx.shadowBlur=26;

const SPOT={x:430,y:468,h:232};   /* field-picture coordinates (the neon ring); h = dancer height */
/* the club "camera": the menu framing; the game keeps exactly the same frame, the menu panel becomes the slicing field */
function frameGeo(footY,titleB){
  let k=(footY-titleB)/(SPOT.y-150); k=Math.max(W/FIELD_C.w,(H-footY)/(FIELD_C.h-SPOT.y),Math.min(k,W/430,W/520));
  const ox=Math.min(0,Math.max(W-FIELD_C.w*k,W/2-510*k)), oy=footY-SPOT.y*k;
  return {k,ox,oy,X:x=>ox+x*k,Y:y=>oy+y*k};
}
let FR=null;
/* the club camera glides to its new framing instead of jumping (panel resize, menu -> game -> menu) */
function smoothCam(T){
  const c=G.cam;
  if(!c||c.W!==W||c.H!==H||REDUCED) G.cam={W,H,k:T.k,ox:T.ox,oy:T.oy};
  else { const a=0.16; c.k+=(T.k-c.k)*a; c.ox+=(T.ox-c.ox)*a; c.oy+=(T.oy-c.oy)*a; }
  let panel=T.panel;
  if(panel){ const c2=G.cam; if(c2.py==null||REDUCED) c2.py=panel.y; else c2.py+=(panel.y-c2.py)*0.16;   /* the field grows smoothly */
    const bot=panel.y+panel.h; panel=Object.assign({},panel,{y:c2.py,h:bot-c2.py}); }
  const {k,ox,oy}=G.cam; return {k,ox,oy,X:x=>ox+x*k,Y:y=>oy+y*k,panel};
}

ctrl.addEventListener('pointerdown',e=>{
  e.preventDefault(); if(G.state==='boot'){ cutBoot('shootR'); return; } if(G.state!=='play') return;
  try{ctrl.setPointerCapture(e.pointerId);}catch(_){}

  ptrs.set(e.pointerId,g); lastDown={t:wall};

/* desktop testing: with a mouse, a quick flick of the cursor slices — no click needed (a click is still a tap) */
const hov={pts:[],last:0};
function hoverSlice(e){
  const p=localPt(e), now=performance.now();
  hov.pts.push({x:p.x,y:p.y,t:now}); while(hov.pts.length&&now-hov.pts[0].t>140) hov.pts.shift();
  G.trail.push({x:p.x,y:p.y,life:0,id:'mouse'});
  if(now-hov.last<220) return;
  const a=hov.pts[0], dx=p.x-a.x, dy=p.y-a.y, d=Math.hypot(dx,dy), dt=now-a.t;
  if(d>=55&&dt>0&&d/dt>0.45){
    const mv=Math.abs(dx)>Math.abs(dy)?(dx>0?'shootR':'shootL'):(dy<0?'woah':'griddy');
    if(G.state==='boot') cutBoot(mv); else doMove(mv,clockT()-dt/2000);   /* middle of the flick */
    hov.last=now; hov.pts=[{x:p.x,y:p.y,t:now}];
  }
}
ctrl.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'&&e.buttons===0){ if(G.state==='play'||G.state==='boot') hoverSlice(e); return; }
  const g=ptrs.get(e.pointerId); if(!g) return; const p=localPt(e); p.t=clockT(); g.pts.push(p);
  if(!g.done&&!g.cancel&&Math.hypot(p.x-g.pts[0].x,p.y-g.pts[0].y)>=28){ g.done=true; const s0=g.pts.find(q=>Math.hypot(q.x-g.pts[0].x,q.y-g.pts[0].y)>=10)||p; doMove(classify(g.pts),(s0.t+p.t)/2); } /* swipe time = middle of the stroke */
  G.trail.push({x:p.x,y:p.y,life:0,id:e.pointerId});
});
function endPtr(e){
  const g=ptrs.get(e.pointerId); if(!g) return; ptrs.delete(e.pointerId); clearTimeout(g.timer);
  if(g.cancel) return;
  if(e.type==='pointercancel') return;
  if(!g.done) doMove(classify(g.pts),g.jt);
}
ctrl.addEventListener('pointerup',endPtr); ctrl.addEventListener('pointercancel',endPtr);
function pathLen(p){let l=0;for(let i=1;i<p.length;i++) l+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);return l;}
function classify(p){
  const a=p[0], b=p[p.length-1], len=pathLen(p), dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy);
  if(len<16||d<24) return 'pop';
  if(Math.abs(dx)>Math.abs(dy)) return dx>0?'shootR':'shootL';
  return dy<0?'woah':'griddy';
}

});

  /* turning the music off? the DJ has something to say first */
  $('settings').classList.add('hidden'); $('menu').classList.add('hidden');
  talk('Эй-эй-эй! Ты что, правда хочешь выключить МОЮ музыку?!',()=>
  talk('Ладно, выключаю… Но танцевать в тишине — это как торт без свечей. Я обиделся.',()=>{
    SET.sound=false; saveLS('bn-settings',SET); applySound(); renderSettings();
    $('menu').classList.remove('hidden'); $('settings').classList.remove('hidden');
  },'angry'),'angry');
}
document.querySelectorAll('.setRow').forEach(r=>r.addEventListener('click',e=>{ e.preventDefault(); (r.dataset.sw==='swSnd'?toggleSnd:toggleVib)(); }));
$('pauseBtn').onclick=pauseGame;
$('resumeBtn').onclick=resumeGame;
$('restartBtn').onclick=()=>{ if(ac) ac.resume(); if(G.boss) sel.boss=true; if(G.free) sel.free=G.free; startGame(); };
$('menuBtn').onclick=()=>{ if(ac) ac.resume(); toMenu(); renderMenu(); menuView('lvl'); };
$('againBtn').onclick=()=>{ if(G.boss) sel.boss=true; if(G.free) sel.free=G.free; startGame(); };
$('nextBtn').onclick=()=>{ sel.char=G.ci; sel.level=G.level+1; startGame(); };
$('backBtn').onclick=()=>{ sel.char=G.ci; toMenu(); renderMenu(); menuView('lvl'); };

/* ---------- loop ---------- */
let lastFrame=performance.now(), lastDemo=-1;
const DEMO=['woah','griddy','shootR','pop','tut','shootL','milly'];
function frame(){
  { const c=TH(); if(c!==THM.ui){ THM.ui=c; applyThemeUI(); } }   /* UI colours follow the gliding theme */
  const nowW=performance.now(), dt=Math.min(0.05,(nowW-lastFrame)/1000); lastFrame=nowW;
  const t=clockT();
  talkTick();
  if(G.state==='play'){
    pump(); checkMisses();
    const bp=beatPos();
    if(G.state==='play'&&!G.goSaid&&bp>=0){ G.goSaid=true; say(DJ.go,true,1.2); }
    if(G.state==='play'&&G.free&&G.baseChart&&G.notes.length-G.ni<16){   /* queue the next lap of the same chart */
      G.loopK++; const off=G.loopK*G.loopLen/G.spb;
      G.notes.push(...G.baseChart.map(n=>({beat:n.beat+off,mv:n.mv,lane:n.lane,st:0})));
    }
    if(G.state==='play'&&G.free&&G.loopLen){ const lap=Math.floor((ac.currentTime-(G.start-G.track.phase-G.track.lead*G.spb))/G.loopLen);
      if(lap>(G.lapShown||0)){ G.lapShown=lap; addText('Круг '+(lap+1),'#ffffff',3); } }
    if(G.state==='play'&&G.meter>=100&&!G.goldArmed&&!superActive(bp)) armGold();
    if(G.state==='play'&&ac.currentTime>G.end) finish(false);
  }

  if(G.state!=='pause'){
    updatePose(dt,t);
    for(const tx of G.texts) tx.life+=dt; G.texts=G.texts.filter(x=>x.life<x.max);
    for(const p of G.sparks){p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;} G.sparks=G.sparks.filter(p=>p.life<p.max);
    for(const p of G.trail) p.life+=dt; G.trail=G.trail.filter(p=>p.life<0.35);
    G.flash*=Math.pow(0.02,dt); G.burst=Math.max(0,G.burst-dt*0.8);
  }
  draw(t); updateHUD();
  requestAnimationFrame(frame);
}
window.addEventListener('resize',resize);
renderMenu(); resize();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(buildBg);
requestAnimationFrame(frame);
})();
</script>
