<title>Birthday Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,400;0,500;0,600;0,700;0,800;1,700&family=Kaushan+Script&display=swap" rel="stylesheet">
<style>
:root{
  --m:16px;   /* iOS grid: 16 pt side margins */
  --g:13px;   /* gutter between columns */
  --night:#0b0814;
  --acc-rgb:180,75,255;
  --hud:#ffffff;
  --hud-dim:rgba(255,255,255,.62);
  --sheet:rgba(20,13,38,.80);
  --sheet-ink:#f5f0ff;
  --sheet-muted:#b9afd8;
  --sheet-line:rgba(255,255,255,.14);
  --chip:rgba(255,255,255,.07);
  --accent:#b44bff;
  --accent-2:#ff3d9a;
  --accent-ink:#ffffff;
  --gold:#ffd23f;
  --scrim:rgba(6,4,14,.55);
  color-scheme:dark;
  box-sizing:border-box;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--night);font-family:'Exo 2',system-ui,-apple-system,sans-serif;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
/* phones: full screen. Desktop (mouse): a tall frame in modern phone proportions, 19.5:9 */
#app{position:relative;margin:0 auto;overflow:hidden;background:var(--night);width:100vw;height:100vh;height:100dvh}
@media (hover:hover) and (pointer:fine){
  body{display:flex;align-items:center;justify-content:center;background:#07060c}
  #app{height:calc(100vh - 24px);height:calc(100dvh - 24px);width:min(100vw,calc((100vh - 24px)*9/19.5));width:min(100vw,calc((100dvh - 24px)*9/19.5));
    border-radius:34px;box-shadow:0 0 0 2px #2a2540,0 20px 60px rgba(0,0,0,.6)}
}
canvas#game{position:absolute;inset:0;width:100%;height:100%;display:block}
#ctrl{position:absolute;inset:0;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;color:var(--hud);pointer-events:none}
#hud .topBar{pointer-events:auto}
#hud .scoreBox{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:84px;padding:0 6px;height:40px;border-radius:10px;background:rgba(10,7,26,.8);border:1px solid rgba(var(--acc-rgb),.5)}
#hud .score{font:700 18px/1 'Exo 2',system-ui,sans-serif;letter-spacing:.01em;color:#fff}
.hearts{display:flex;gap:3px;margin-top:4px;font:15px/1 system-ui,sans-serif}
.hearts i{font-style:normal;color:#ff3d7f;text-shadow:0 0 6px rgba(255,61,127,.7)}
.hearts i.off{color:rgba(255,255,255,.18);text-shadow:none}
.hearts.hurt{animation:hurt .4s}
@keyframes hurt{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
#hud .track{display:none}
#hud .combo{font:600 11.5px/1.1 'Exo 2',sans-serif;display:flex;gap:4px;align-items:baseline;color:var(--accent-2);margin-top:3px;min-height:12px}
#hud .combo small{font:600 11px "Exo 2",sans-serif;color:var(--hud-dim)}
#hud #pauseBtn{pointer-events:auto}
#pauseBtn:focus-visible,.sheet button:focus-visible{outline:3px solid #2de1fc;outline-offset:2px}
.hidden{display:none!important}
.overlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(transparent 35%,var(--scrim))}
.sheet{background:var(--sheet);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border-top:1px solid rgba(180,75,255,.55);color:var(--sheet-ink);width:100%;max-height:66%;overflow:auto;
  border-radius:26px 26px 0 0;padding:20px 18px 24px;box-shadow:0 -12px 40px rgba(180,75,255,.22),inset 0 1px 0 rgba(255,255,255,.06)}
.sheet h1{font:600 34px/1 'Exo 2',sans-serif;margin:0 0 8px;letter-spacing:-.01em}
.sheet h2{font:500 15px/1.2 'Exo 2',sans-serif;margin:18px 0 10px}
.sheet p{margin:0;color:var(--sheet-muted);font-size:15px;line-height:1.45}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick{appearance:none;text-align:left;background:var(--chip);color:var(--sheet-ink);border:2px solid transparent;
  border-radius:16px;padding:11px 12px;font:inherit;cursor:pointer;display:flex;gap:10px;align-items:center}
.pick[aria-pressed="true"]{border-color:var(--accent);background:rgba(180,75,255,.14);box-shadow:0 0 18px rgba(180,75,255,.35)}
.pick:hover:not(:disabled){background:rgba(255,255,255,.11)}
.pick b{display:block;font:500 14px "Exo 2",sans-serif}
.pick span.sub{display:block;font-size:12.5px;line-height:1.3;color:var(--sheet-muted);margin-top:3px}
.dot{flex:none;width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 2px rgba(255,255,255,.18),0 0 14px rgba(180,75,255,.35)}
details{margin-top:16px;border-top:1px solid var(--sheet-line);padding-top:12px}
summary{font:500 14px "Exo 2",sans-serif;cursor:pointer}
.how{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:7px;font-size:14px;color:var(--sheet-muted)}
.how b{color:var(--sheet-ink)}
.primary{display:block;width:100%;margin-top:18px;border:0;border-radius:16px;padding:17px;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 6px 24px rgba(180,75,255,.45);
  color:var(--accent-ink);font:600 17px "Exo 2",sans-serif;cursor:pointer}
.secondary{display:block;width:100%;margin-top:10px;border:1.5px solid var(--sheet-line);border-radius:16px;padding:15px;
  background:transparent;color:var(--sheet-ink);font:500 15px "Exo 2",sans-serif;cursor:pointer}
.levels{display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
#menu .pick{min-width:0;max-width:100%}
.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:var(--g)!important}
.pick.free{margin-top:8px;width:100%}
#freeList{max-height:46vh;overflow:auto}
/* ---------- main menu (neon UI) ---------- */
#menu{flex-direction:column;align-items:stretch;justify-content:flex-end}
.topBar{position:absolute;top:calc(8px + max(env(safe-area-inset-top,0px),var(--st,0px)));left:var(--m);right:var(--m);z-index:4;display:flex;align-items:center;gap:6px;
  padding:6px 6px 6px 6px;background:linear-gradient(180deg,rgba(14,10,34,.86),rgba(14,10,34,.6));border:1px solid rgba(var(--acc-rgb),.45);border-radius:18px;
  box-shadow:0 0 16px rgba(var(--acc-rgb),.25),inset 0 1px 0 rgba(255,255,255,.06);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.player{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.ava{flex:none;width:66px;height:66px;margin:-12px;transform:scale(.64);border-radius:50%;box-shadow:0 0 0 3px var(--accent),0 0 16px rgba(var(--acc-rgb),.8),inset 0 0 10px rgba(var(--acc-rgb),.35)}
.pInfo{min-width:0;flex:1}
.pInfo b{display:block;font:600 14px/1.1 'Exo 2',sans-serif;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv{display:flex;align-items:center;gap:6px;margin-top:4px}
.lv span{font:700 10px/1 'Exo 2',sans-serif;color:var(--accent-2);border:1px solid rgba(var(--acc-rgb),.6);border-radius:5px;padding:2px 4px}
.lv i{flex:1;max-width:150px;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.lv em{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 0 8px var(--accent)}
.menuPlayer{flex:none;gap:10px}
.menuPlayer b{font:700 16px/1 'Exo 2',sans-serif;color:#fff;white-space:nowrap;align-self:center}
/* little TV in the top bar with a running ad line */
.tv{flex:1;min-width:0;height:40px;padding:3px;border-radius:9px;background:linear-gradient(180deg,#2a2440,#120e22);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 0 0 1px rgba(var(--acc-rgb),.45),0 0 12px rgba(var(--acc-rgb),.25);position:relative}
.tv::after{content:'';position:absolute;left:50%;bottom:-5px;width:22px;height:3px;margin-left:-11px;border-radius:2px;background:rgba(var(--acc-rgb),.55)}
.tvScreen{position:relative;height:100%;border-radius:6px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#1b1236,#07050f 75%);
  box-shadow:inset 0 0 10px rgba(0,0,0,.9),inset 0 0 0 1px rgba(0,0,0,.6);display:flex;align-items:center}
.tvScreen::before{content:'';position:absolute;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px),linear-gradient(180deg,rgba(255,255,255,.10),transparent 45%)}
.tvText{position:absolute;left:0;white-space:nowrap;font:700 13px/1 'Exo 2',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-2);
  text-shadow:0 0 6px var(--accent),0 0 12px rgba(var(--acc-rgb),.6);padding-left:100%;animation:tvRun 9s linear infinite}
@keyframes tvRun{from{transform:translateX(0)}to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.tvText{animation:none;padding-left:8px}}
.pill{flex:none;display:flex;align-items:center;gap:4px;height:32px;padding:0 3px 0 6px;border-radius:10px;background:rgba(10,7,26,.8);border:1px solid rgba(var(--acc-rgb),.5)}
.pill svg{width:18px;height:18px}
.pill b{font:600 13px/1 'Exo 2',sans-serif;color:#fff;min-width:14px;text-align:center}
.plus{appearance:none;width:22px;height:22px;border-radius:6px;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;font:600 15px/1 'Exo 2',sans-serif;padding:0;cursor:pointer}
.topBar .gear{position:static;flex:none;width:44px;height:44px;border-radius:12px}
.gameTitle{position:absolute;top:calc(88px + max(env(safe-area-inset-top,0px),var(--st,0px)));left:0;right:0;margin:0;text-align:center;pointer-events:none;color:var(--accent-2)}
.gameTitle .crown{display:block;width:34px;height:24px;margin:0 auto -6px;filter:drop-shadow(0 0 6px var(--accent))}
.gameTitle h1{margin:0;font:400 46px/1.15 'Kaushan Script','Exo 2',cursive;transform:rotate(-6deg);color:var(--accent-2);
  text-shadow:0 0 2px #fff,0 0 8px var(--accent),0 0 22px var(--accent),0 0 40px var(--accent)}
/* angular neon panels: an outer clipped layer is the glowing border, the inner one the glass */
.panel,.pick,.tabHead,.playWrap{--c:14px}
#app .sheet.panel{position:relative;z-index:3;margin:0 var(--m) calc(12px + max(env(safe-area-inset-bottom,0px),var(--sb,0px)));width:auto;max-height:none;overflow:visible;border:0;border-radius:0;background:none;box-shadow:none;
  -webkit-backdrop-filter:none;backdrop-filter:none;padding:14px var(--g) var(--g);filter:drop-shadow(0 0 10px rgba(var(--acc-rgb),.35))}
#app .sheet.panel::before,#menu .pick::before,.tabHead::before,.playWrap::before{content:'';position:absolute;inset:0;background:linear-gradient(160deg,rgba(var(--acc-rgb),.95),rgba(var(--acc-rgb),.35) 45%,rgba(var(--acc-rgb),.8));
  clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c));z-index:-1}
#app .sheet.panel::after,#menu .pick::after,.tabHead::after{content:'';position:absolute;inset:1.5px;background:rgba(13,9,32,.93);z-index:-1;
  clip-path:polygon(var(--c) 0,calc(100% - var(--c)) 0,100% var(--c),100% calc(100% - var(--c)),calc(100% - var(--c)) 100%,var(--c) 100%,0 calc(100% - var(--c)),0 var(--c))}
#app .sheet.panel>div{position:relative;z-index:1}
#app .sheet.panel #freeList,#app .sheet.panel #achList{max-height:min(46vh,380px);overflow:auto}
.tabHead{position:relative;z-index:0;--c:10px;display:flex;align-items:center;gap:12px;width:max-content;max-width:100%;margin:-2px 0 12px 0;padding:10px 18px 10px 14px;white-space:nowrap;
  font:700 15px/1 'Exo 2',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2);text-shadow:0 0 6px var(--accent),0 0 12px rgba(var(--acc-rgb),.6)}
.tabHead>span:not(.tabIco):not(.dot){overflow:hidden;text-overflow:ellipsis}
.tabHead::before{background:linear-gradient(90deg,rgba(var(--acc-rgb),.95),rgba(var(--acc-rgb),.25))}
.tabIco{width:24px;height:24px;color:var(--accent-2);filter:drop-shadow(0 0 5px var(--accent))}
#menu .pick{position:relative;z-index:0;background:none;border:0;border-radius:0;--c:12px}
#menu .pick::before{background:rgba(var(--acc-rgb),.35)}
#menu .pick:hover:not(:disabled)::after{background:rgba(24,17,52,.95)}
#menu .pick[aria-pressed="true"]{box-shadow:none;background:none;filter:drop-shadow(0 0 9px var(--accent))}
#menu .pick[aria-pressed="true"]::before{background:linear-gradient(160deg,#fff,var(--accent-2) 30%,var(--accent))}
#menu .pick[aria-pressed="true"]::after{inset:2.5px;background:rgba(18,12,42,.95)}
#menu .pick.char{padding:14px 8px 12px;gap:8px}
#menu .pick.char .dot{width:66px;height:66px;box-shadow:0 0 0 2.5px var(--accent),0 0 10px rgba(var(--acc-rgb),.75),0 0 22px rgba(var(--acc-rgb),.35),inset 0 0 12px rgba(var(--acc-rgb),.35)}
@media (prefers-reduced-motion:no-preference){#menu .pick.char .dot{animation:ringGlow 2.4s ease-in-out infinite}}
@keyframes ringGlow{50%{box-shadow:0 0 0 2.5px var(--accent),0 0 16px rgba(var(--acc-rgb),.95),0 0 30px rgba(var(--acc-rgb),.5),inset 0 0 14px rgba(var(--acc-rgb),.45)}}
#menu .pick.char b,#hud .pInfo b{font:700 15px/1 'Exo 2',sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2);

/* ---------- transitions ---------- */
.gameTitle{transition:translate .5s cubic-bezier(.5,-0.3,.6,1),opacity .4s}
#menu.titleUp .gameTitle{translate:0 -260px;opacity:0;transition:translate .6s cubic-bezier(.45,-0.25,.75,.2),opacity .2s .45s}
#menu:not(.titleUp) .gameTitle{transition:translate .55s cubic-bezier(.2,1,.3,1.15),opacity .35s}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes sheetDown{to{transform:translateY(60px);opacity:0}}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes dropIn{from{transform:translateY(-18px);opacity:0}}
@keyframes liftOut{to{transform:translateY(-18px);opacity:0}}
@keyframes titleIn{from{transform:scale(.85);opacity:0;filter:blur(4px)}}
@keyframes vinF{from{transform:translateX(28px);opacity:0}}
@keyframes vinB{from{transform:translateX(-28px);opacity:0}}
@keyframes toastIn{from{transform:translate(-50%,16px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes popIn{from{transform:scale(.92);opacity:0}}
@media (prefers-reduced-motion:no-preference){
  .overlay:not(.hidden) .sheet{animation:sheetUp .42s cubic-bezier(.2,.9,.3,1.15) both}
  #menu:not(.hidden) .topBar{animation:dropIn .45s .05s cubic-bezier(.2,.9,.3,1) both}
  #menu:not(.hidden) .gameTitle{animation:titleIn .6s .1s cubic-bezier(.2,.9,.3,1) both}
  #menu.leaving .sheet{animation:sheetDown .36s cubic-bezier(.5,0,.8,.4) forwards}
  #menu.leaving .topBar{animation:liftOut .32s ease-in forwards}
  #menu.leaving .gameTitle{animation:fadeOut .3s ease-in forwards}
  #settings:not(.hidden){animation:fadeIn .25s both}
  #settings.closing{animation:fadeOut .26s forwards}
  #settings.closing .sheet{animation:sheetDown .26s ease-in forwards}
  #hud:not(.hidden) .topBar{animation:dropIn .45s cubic-bezier(.2,.9,.3,1) both}
  .vin-f{animation:vinF .34s cubic-bezier(.2,.8,.2,1) both}
  .vin-b{animation:vinB .34s cubic-bezier(.2,.8,.2,1) both}
  .vin-f .pick,.vin-b .pick{animation:popIn .4s cubic-bezier(.2,.9,.3,1.2) both}
  .vin-f .pick:nth-child(2),.vin-b .pick:nth-child(2){animation-delay:.04s}
  .vin-f .pick:nth-child(3),.vin-b .pick:nth-child(3){animation-delay:.08s}
  .vin-f .pick:nth-child(4),.vin-b .pick:nth-child(4){animation-delay:.12s}
  .vin-f .pick:nth-child(5),.vin-b .pick:nth-child(5){animation-delay:.16s}
  .vin-f .pick:nth-child(n+6),.vin-b .pick:nth-child(n+6){animation-delay:.2s}
  .toast:not(.hidden){animation:toastIn .3s both}
}

let APP=2.1; const BLUE='#2d8cff', RED='#ff3b5c';
/* stage on top, slicing tunnel below with a single hit frame in the middle */
function saberGeo(){ const y0=FR?FR.panel.y:H/3, bot=FR?FR.panel.y+FR.panel.h:H, th=bot-y0, size=Math.round(Math.min(W*0.5,th*0.34,210)), c=W/2;

  return {y0,size,vpx:c,vpy:y0-40,hy:y0+th*0.52,lx:[c,c,c],bottom:bot}; }
function proj(G2,lane,d){ /* front face of the cube when it is d seconds from the hit plane */
  const c=cam(G2), z=cubeZ(d), zf=z-0.5;
  return {x:G2.vpx, y:G2.vpy+c.f*c.camY/z, s:c.f/zf};
}
/* real 3D: a camera above the track; cubes (1 unit) travel along z towards it.
   At the hit plane (z=ZH) the front face is exactly the frame size and sits on the frame. */
const ZH=5, ZR=5; /* hit depth, and how much farther the spawn point is */
function cam(G2){ const f=G2.size*(ZH-0.5); return {f, camY:(G2.hy-G2.vpy)*ZH/f}; }
function cubeZ(d){ return Math.max(1.3, ZH*(1+(ZR-1)*d/APP)); }
function P3(G2,c,x,y,z){ return [G2.vpx+c.f*x/z, G2.vpy+c.f*(c.camY-y)/z]; }

function rng(seed){ return ()=>{ seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
/* one note per beat at most; mostly every 2 beats on easy; a 2-beat rest every 16 beats */
function buildChart(n,li,seed,spb){
  const r=rng(seed), out=[]; let b=0;
  while(b<n-1){
    if(b%16>=14){ b=Math.ceil((b+1)/16)*16; continue; }
    let mv; do{ mv=NOTE_MV[r()*5|0]; }while(out.length>=2&&out[out.length-1].mv===mv&&out[out.length-2].mv===mv);
    const lane=mv==='shootL'?(r()<0.7?0:1):mv==='shootR'?(r()<0.7?2:1):(r()*3|0);
    out.push({beat:b,mv,st:0,lane});
    b+=(r()<DIFF[li].one&&spb>=0.55)?1:2;   /* one block per beat most of the time */
  }
  return out;
}

    const comp=ac.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=3;
    master=ac.createGain(); master.gain.value=0.85; master.connect(comp); comp.connect(ac.destination); applySound();

function scheduleStep(i,t){
  const T=G.track,bus=G.bus,sd=G.spb/4,bar=Math.floor(i/16),s=i%16;
  if(bar===0){ if(s%4===0) click(bus,t,s===0); if(s%2===0) hat(bus,t,false,0.8); return; }
  const b=bar-1, [off,minor]=T.prog[b%4], cr=T.root+off, brk=(b===15), fill=(b%8===7);
  if(!brk && T.kick.includes(s)) kick(bus,t);
  if(s===4||s===12) snare(bus,t);
  if(fill && !brk && s>=13) snare(bus,t,0.45);
  if(brk && s>=8 && s%2===0) snare(bus,t,0.35+(s-8)*0.08);
  if(s%2===0) hat(bus,t,s===14); else if(T.hat16) hat(bus,t,false,0.6);
  if(!brk) for(const [st,iv,len] of T.bass) if(st===s) tone(bus,t,'sawtooth',mtof(cr-12+iv),len*sd*0.95,0.3,420);
  if(s===0){ const th=minor?3:4; [0,th,7].forEach(x=>pad(bus,t,mtof(cr+12+x),16*sd)); }
  if(((b>=8&&b<15)||(b>=24&&b<31)) && b%2===0) for(const [st,pi] of LEAD) if(st===s) tone(bus,t,'square',mtof(T.root+24+PENT[pi]),sd*1.6,0.05,1800);
}
function pump(){
  if(!ac||!G.bus) return;
  const sd=G.spb/4;
  while(G.nextT<ac.currentTime+0.12 && G.step<G.totalSteps){ scheduleStep(G.step,G.nextT); G.step++; G.nextT+=sd; }
}
function stopBus(){
  if(G.src){ try{ G.src.stop(ac.currentTime+0.1); }catch(e){} G.src=null; }
  if(G.bus&&ac){ const b=G.bus; b.gain.setValueAtTime(b.gain.value,ac.currentTime); b.gain.linearRampToValueAtTime(0,ac.currentTime+0.08); setTimeout(()=>{try{b.disconnect();}catch(e){}},200); }
  G.bus=null;
}

function mmVoice(dst,t,type,f,dur,peak,cut,res,det){   /* one synth voice: osc → resonant lowpass with a plucky envelope */

  const fl=ac.createBiquadFilter(); fl.type='lowpass'; fl.Q.value=res||1; fl.frequency.setValueAtTime(cut*2.2,t); fl.frequency.exponentialRampToValueAtTime(Math.max(80,cut*0.6),t+dur);
  const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(peak,t+0.006); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(fl); fl.connect(g); g.connect(dst); o.start(t); o.stop(t+dur+0.05);
}
function clubKick(dst,t,v=1){ const o=ac.createOscillator(),g=ac.createGain(); o.frequency.setValueAtTime(155,t); o.frequency.exponentialRampToValueAtTime(48,t+0.09); o.frequency.exponentialRampToValueAtTime(38,t+0.35);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(1.1*v,t+0.003); g.gain.exponentialRampToValueAtTime(0.0001,t+0.42); o.connect(g); g.connect(dst); o.start(t); o.stop(t+0.45);
  noise(dst,t,'highpass',4000,0.7,0.12*v,0.015); }
function clap(dst,t,v=1){ for(const d of [0,0.011,0.022]) noise(dst,t+d,'bandpass',1350,1.1,0.42*v,d===0.022?0.17:0.03); }
function mmStep(i,t){
  const b=MM.bus, s=i%16, bar=Math.floor(i/16)%16, [root,maj]=MM_CH[bar%4], sd=MM.spb/4;
  const intro=bar<2, build=bar===7||bar===15, drop=(bar>=8&&bar<15);
  // sidechain: everything melodic ducks on each kick ("pumping")
  if(s%4===0&&!(build&&s>=8)){ clubKick(b,t,1); const d=MM.duck.gain; d.cancelScheduledValues(t); d.setValueAtTime(0.18,t); d.linearRampToValueAtTime(1,t+MM.spb*0.85); }
  if(build&&s>=8) clubKick(b,t,0.55+((s-8)/8)*0.45);   // 16th kick roll into the drop
  if(!intro&&(s===4||s===12)) clap(b,t);
  if(s%4===2) hat(b,t,true,0.7); else if(!intro) hat(b,t,false,s%2?0.35:0.5);
  if(drop&&s%2===1) noise(b,t,'highpass',9000,0.5,0.05,0.02);   // shaker
  const m=MM.mel;
  // rolling offbeat bass
  if(!intro&&(s%4===2||s%4===3)) mmVoice(m,t,'sawtooth',mtof(root-24),sd*0.9,0.28,drop?520:300,6);
  // stab chords: off-beat in the verse, big supersaw on the drop
  const th=maj?4:3, ch=[0,th,7,12];
  if(!intro&&!drop&&(s===2||s===10)) ch.forEach(x=>mmVoice(m,t,'sawtooth',mtof(root+x),sd*1.4,0.045,1400,3));
  if(drop&&[0,3,6,10,12].includes(s)) ch.forEach(x=>{ mmVoice(m,t,'sawtooth',mtof(root+x),sd*1.6,0.05,2600,2,-12); mmVoice(m,t,'sawtooth',mtof(root+x),sd*1.6,0.05,2600,2,12); });
  // pluck lead arp over the second half of the verse
  if(bar>=4&&bar<8&&s%2===0){ const arp=[0,7,12,th,7,12+th,12,7][(s/2)|0]; mmVoice(m,t,'square',mtof(root+12+arp),sd*0.9,0.04,3200,4); }
  // riser + snare roll on the build bar
  if(build){ if(s===0){ const n=ac.createBufferSource(); n.buffer=noiseBuf; n.loop=true; const f=ac.createBiquadFilter(); f.type='bandpass'; f.Q.value=2; f.frequency.setValueAtTime(400,t); f.frequency.exponentialRampToValueAtTime(7000,t+MM.spb*4);
      const g=ac.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.16,t+MM.spb*4); g.gain.setValueAtTime(0.0001,t+MM.spb*4+0.01); n.connect(f); f.connect(g); g.connect(b); n.start(t); n.stop(t+MM.spb*4+0.05); }
    if(s>=8) noise(b,t,'bandpass',1800,0.9,0.12+0.03*(s-8),0.06); }
  // crash on the first beat of the drop
  if(bar===8&&s===0) noise(b,t,'highpass',5000,0.4,0.25,1.2);
}

function judgeNote(t){
  const pos=(t-lat()-G.start)/G.spb-INTRO, gw=goodWin()/1000/G.spb;

  for(let i=G.ni;i<G.notes.length;i++){ const n=G.notes[i]; if(n.beat-pos>gw) break; if(n.st) continue;
    const d=Math.abs(n.beat-pos); if(d<=gw&&d<bd){ bd=d; best=n; } }
  return best?{n:best,err:bd*G.spb*1000,early:best.beat>pos}:null;
}

$('playBtn').onclick=()=>{ G.char=CHARS[sel.char]; G.swap=null; applyThemeUI(); renderMenu(); menuView('lvl'); };
$('backChar').onclick=()=>menuView('pick');
$('backLvl').onclick=()=>menuView('lvl');
let toastT=0; $('app').appendChild($('toast'));
{ let taps=[]; document.querySelector('#menu .tv').addEventListener('click',()=>{ const n=performance.now(); taps=taps.filter(t=>n-t<2500); taps.push(n);
    if(taps.length>=5){ taps=[]; DEV=!DEV; try{ localStorage.setItem('bn-dev',DEV?'1':'0'); }catch(e){} renderMenu(); toast(DEV?'Режим разработчика: всё открыто':'Режим разработчика выключен'); } }); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.remove('hidden'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.add('hidden'),1800); }
/* ---------- achievements ---------- */
const totalStars=()=>CHARS.reduce((a,ch)=>a+starsOf(ch.id).reduce((x,y)=>x+y,0),0);
let ACH={got:{},won:{},drinks:{}}; try{ ACH=Object.assign(ACH,JSON.parse(localStorage.getItem('bn-ach')||'{}')); }catch(e){}
const ACHS=[
  {id:'first',name:'Первый танец',desc:'Пройди любой уровень',test:c=>c.win},
  {id:'three',name:'Три звезды',desc:'Получи 3 звезды на уровне',test:c=>c.stars===3},
  {id:'clean',name:'Ни шагу мимо',desc:'Пройди уровень, не потеряв ни одной жизни',test:c=>c.win&&c.lost<=0&&!c.boss},
  {id:'c25',name:'Разогнался',desc:'Комбо 25',test:c=>c.maxCombo>=25,prog:c=>[c.bestCombo,25]},
  {id:'c100',name:'Машина',desc:'Комбо 100',test:c=>c.maxCombo>=100,prog:c=>[c.bestCombo,100]},
  {id:'perf50',name:'Перфекционист',desc:'50 PERFECT за один раунд',test:c=>c.perfect>=50},
  {id:'hard',name:'Без скидок',desc:'Пройди сложный уровень',test:c=>c.win&&c.li===2&&!c.free&&!c.boss},
  {id:'crew',name:'Вся компания',desc:'Победи за каждого из четверых',test:c=>Object.keys(ACH.won).length>=4,prog:()=>[Object.keys(ACH.won).length,4]},
  {id:'stars20',name:'Звёздный вечер',desc:'Собери 20 звёзд',test:()=>totalStars()>=20,prog:()=>[totalStars(),20]},
  {id:'allhard',name:'Именинник',desc:'Пройди все четыре сложных уровня',test:()=>CHARS.every(ch=>starsOf(ch.id)[2]>0),prog:()=>[CHARS.filter(ch=>starsOf(ch.id)[2]>0).length,4]},
  {id:'marathon',name:'Марафонец',desc:'Продержись 3 круга в свободном режиме',test:c=>c.free&&c.laps>=2},
  {id:'critic',name:'Критик',desc:'Скажи диджею, что его музыка не крутая',test:()=>!!ACH.critic},
  {id:'boss',name:'Король танцпола',desc:'Победи диджея на его же треке',test:c=>c.boss&&c.win}];
function checkAch(c){
  if(c.win&&!c.boss) ACH.won[c.cid]=1;
  ACH.bestCombo=Math.max(ACH.bestCombo||0,c.maxCombo||0); c.bestCombo=ACH.bestCombo;
  const fresh=ACHS.filter(a=>!ACH.got[a.id]&&a.test(c)); fresh.forEach(a=>ACH.got[a.id]=1);
  saveLS('bn-ach',ACH); return fresh;
}
const ACH_ICO={'first': '<path d="M4 15.5c2.5 0 3.5-1 5-3.5l2-3.5 3 2.5 2 3.5h2.5c1.4 0 2.5 1.1 2.5 2.5v.5H4z"/><path d="M4 18.5h16"/><path d="M9.5 9.5l2.5 2M8 12l2 1.5"/>', 'three': '<path d="M12 3.5l1.6 3.3 3.6.5-2.6 2.5.6 3.6L12 11.7l-3.2 1.7.6-3.6-2.6-2.5 3.6-.5z"/><path d="M5.5 14l.9 1.8 2 .3-1.4 1.4.3 2-1.8-1-1.8 1 .3-2-1.4-1.4 2-.3zM18.5 14l.9 1.8 2 .3-1.4 1.4.3 2-1.8-1-1.8 1 .3-2-1.4-1.4 2-.3z"/>', 'clean': '<path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/>', 'c25': '<path d="M12 21c-3.9 0-6.5-2.6-6.5-6.2 0-3.4 2.4-5.3 3.4-8.3.4 2 1.5 3 2.6 3.5-.4-2.8.6-5.4 3-7 0 3.4 4 5.6 4 11.3C18.5 18.2 15.9 21 12 21z"/><path d="M12 21c-1.6 0-2.7-1.1-2.7-2.7 0-1.7 1.4-2.4 1.9-3.9.9 1 2.1 1.7 2.1 3.6 0 1.7-.7 3-1.3 3z"/>', 'c100': '<path d="M13.5 2.5L5 13.5h6l-1.5 8 8.5-11h-6z"/>', 'perf50': '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/>', 'hard': '<path d="M2.5 19.5l6-10 3.5 5 2.5-3.5 7 8.5z"/><path d="M8.5 9.5V4.5l3.5 1.5-3.5 1.5"/>', 'crew': '<circle cx="7" cy="8" r="2.3"/><circle cx="17" cy="8" r="2.3"/><circle cx="12" cy="6.5" r="2.3"/><path d="M3 18.5c0-2.6 1.8-4.5 4-4.5s4 1.9 4 4.5M13 18.5c0-2.6 1.8-4.5 4-4.5s4 1.9 4 4.5M8.5 15c.6-2.4 1.9-3.8 3.5-3.8s2.9 1.4 3.5 3.8"/>', 'stars20': '<path d="M12 4l2 4.2 4.6.6-3.3 3.2.8 4.6L12 14.4l-4.1 2.2.8-4.6L5.4 8.8l4.6-.6z"/><path d="M4 3.5v3M2.5 5h3M20 16.5v3M18.5 18h3M19.5 3.5l.7 1.4"/>', 'allhard': '<path d="M3.5 18.5L5 7.5l4.5 4.5L12 5l2.5 7 4.5-4.5 1.5 11z"/><path d="M3.5 21h17"/><circle cx="12" cy="15" r="1.2" fill="currentColor"/>', 'marathon': '<path d="M7.5 8.5c-2.2 0-4 1.6-4 3.5s1.8 3.5 4 3.5c3.5 0 5.5-7 9-7 2.2 0 4 1.6 4 3.5s-1.8 3.5-4 3.5c-3.5 0-5.5-7-9-7z"/>', 'critic': '<path d="M4 5.5h16v10H11l-4.5 4v-4H4z"/><path d="M12 8v3.5"/><circle cx="12" cy="13.4" r=".6" fill="currentColor"/>', 'boss': '<path d="M4.5 14v-2a7.5 7.5 0 0 1 15 0v2"/><rect x="3" y="13.5" width="4" height="6.5" rx="1.5"/><rect x="17" y="13.5" width="4" height="6.5" rx="1.5"/><path d="M8.5 6l1.5-3 2 2 2-2 1.5 3"/>'};
function renderAch(){
  const c={bestCombo:ACH.bestCombo||0}, n=ACHS.filter(a=>ACH.got[a.id]).length;
  $('achHint').textContent='Открыто '+n+' из '+ACHS.length;
  $('achList').innerHTML=ACHS.map(a=>{ const got=!!ACH.got[a.id], pr=!got&&a.prog?a.prog(c):null;
    return `<div class="pick lvl achRow${got?' got':''}"><span class="badge achIco"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">${ACH_ICO[a.id]||''}</svg>${got?'':`<i class="achLock">${LOCK}</i>`}</span><span class="lvTxt"><b>${a.name}</b><span class="sub">${a.desc}${pr?` · ${Math.min(pr[0],pr[1])}/${pr[1]}`:''}</span></span>${got?'<span class="tag">✓</span>':''}</div>`; }).join('');
}
$('menuTabs').addEventListener('click',e=>{ const b=e.target.closest('[data-mt]'); if(!b) return; const v=b.dataset.mt;
  if(v==='ach') renderAch(); menuView(v); });
$('freeBtn').onclick=()=>{
  $('freeList').innerHTML=Object.entries(REAL).sort((x,y)=>x[0]<y[0]?-1:1).map(([k,T])=>{ const [ar,...rest]=T.name.split(' — '); const [fc,fl]=k.split(',').map(Number), open=freeOpen(k);
    if(!open) return `<button class="pick lvl song" data-free="${k}" disabled><span class="badge">${NOTE_SVG}</span><span class="lvTxt"><b>${rest.length?rest.join(' — '):ar}</b><span class="sub">Пройди уровень ${fl+1} за ${CHARS[fc].name}</span></span><span class="lock" aria-label="закрыто">${LOCK}</span></button>`;
    return `<button class="pick lvl song" data-free="${k}"><span class="badge">${NOTE_SVG}</span><span class="lvTxt"><b>${rest.length?rest.join(' — '):ar}</b><span class="sub">${rest.length?ar+' · ':''}${T.showBpm||T.bpm} BPM</span></span><span class="go play"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg></span></button>`; }).join('');
  menuView('free');
};
/* free mode only offers songs whose level the player has already beaten */
function freeOpen(k){ const [c,l]=k.split(',').map(Number); return DEV||starsOf(CHARS[c].id)[l]>0; }
$('freeList').addEventListener('click',e=>{ const b=e.target.closest('[data-free]'); if(!b||b.disabled||!freeOpen(b.dataset.free)) return; sel.free=b.dataset.free; G.swap=null; leaveMenu(startGame); });
$('levels').addEventListener('click',e=>{const b=e.target.closest('[data-l]'); if(!b||b.disabled) return; sel.level=+b.dataset.l; renderMenu();});
function backToMenu(){ $('menu').classList.remove('hidden'); }
function djChat(){
  $('menu').classList.add('hidden');
  talk('Слушай, а тебе вообще нравится моя музыка?',null,'happy',[
    {t:'Да, огонь!',f:()=>talk('Вот! Сразу видно человека со вкусом. Иди танцуй.',backToMenu,'happy')},
    {t:'Нет',bad:true,f:()=>talk('Хм… Ты точно уверен? Подумай хорошенько.',null,'smirk',[
      {t:'Шучу, всё круто!',f:()=>talk('То-то же. Я уж было напрягся.',backToMenu,'smirk')},
      {t:'Твоя музыка не крутая',bad:true,f:()=>talk('ЧТО?! Ну всё. Сейчас ты станцуешь под МОЙ трек. Одна ошибка — и ты вылетаешь.',()=>{ ACH.critic=1; saveLS('bn-ach',ACH); sel.boss=true; startGame(); },'angry')}
    ])}
  ]);
}
$('djBtn').onclick=djChat;
/* entering gameplay: the panel sinks, title and top bar fade, then the round starts and the field frame draws itself */
function leaveMenu(go){
  const m=$('menu'); initAudio();
  if(m.classList.contains('hidden')||REDUCED){ go(); return; }
  if(m.classList.contains('leaving')) return;
  m.classList.add('leaving'); setTimeout(()=>{ m.classList.remove('leaving'); go(); },360);
}
$('goBtn').onclick=()=>{ G.swap=null; leaveMenu(startGame); };
/* ---------- settings ---------- */
function renderSettings(){ $('swVib').setAttribute('aria-checked',SET.vib); $('swSnd').setAttribute('aria-checked',SET.sound);
  $('swVibTxt').textContent=SET.vib?'Вкл':'Выкл'; $('swSndTxt').textContent=SET.sound?'Вкл':'Выкл'; }
$('gearBtn').onclick=()=>{ renderSettings(); $('settings').classList.remove('hidden'); };
function closeSettings(){ const st=$('settings'); if(REDUCED){ st.classList.add('hidden'); return; }
  st.classList.add('closing'); setTimeout(()=>{ st.classList.remove('closing'); st.classList.add('hidden'); },260); }
$('setDone').onclick=closeSettings;
function toggleVib(){ SET.vib=!SET.vib; saveLS('bn-settings',SET); renderSettings(); if(SET.vib) buzz(30); }
function toggleSnd(){
  if(!SET.sound){ SET.sound=true; saveLS('bn-settings',SET); applySound(); renderSettings(); return; }
  /* turning the music off? the DJ has something to say first */
  $('settings').classList.add('hidden'); $('menu').classList.add('hidden');
  talk('Эй-эй-эй! Ты что, правда хочешь выключить МОЮ музыку?!',()=>
  talk('Ладно, выключаю… Но танцевать в тишине — это как торт без свечей. Я обиделся.',()=>{
    SET.sound=false; saveLS('bn-settings',SET); applySound(); renderSettings();
    $('menu').classList.remove('hidden'); $('settings').classList.remove('hidden');
  },'angry'),'angry');
}
document.querySelectorAll('.setRow').forEach(r=>r.addEventListener('click',e=>{ e.preventDefault(); (r.dataset.sw==='swSnd'?toggleSnd:toggleVib)(); }));
$('pauseBtn').onclick=pauseGame;
$('resumeBtn').onclick=resumeGame;
$('restartBtn').onclick=()=>{ if(ac) ac.resume(); if(G.boss) sel.boss=true; if(G.free) sel.free=G.free; startGame(); };
$('menuBtn').onclick=()=>{ if(ac) ac.resume(); toMenu(); renderMenu(); menuView('lvl'); };
$('againBtn').onclick=()=>{ if(G.boss) sel.boss=true; if(G.free) sel.free=G.free; startGame(); };
$('nextBtn').onclick=()=>{ sel.char=G.ci; sel.level=G.level+1; startGame(); };
$('backBtn').onclick=()=>{ sel.char=G.ci; toMenu(); renderMenu(); menuView('lvl'); };

/* ---------- loop ---------- */
let lastFrame=performance.now(), lastDemo=-1;
const DEMO=['woah','griddy','shootR','pop','tut','shootL','milly'];
function frame(){
  { const c=TH(); if(c!==THM.ui){ THM.ui=c; applyThemeUI(); } }   /* UI colours follow the gliding theme */
  const nowW=performance.now(), dt=Math.min(0.05,(nowW-lastFrame)/1000); lastFrame=nowW;
  const t=clockT();
  talkTick();
  if(G.state==='play'){
    pump(); checkMisses();
    const bp=beatPos();
    if(G.state==='play'&&!G.goSaid&&bp>=0){ G.goSaid=true; say(DJ.go,true,1.2); }
    if(G.state==='play'&&G.free&&G.baseChart&&G.notes.length-G.ni<16){   /* queue the next lap of the same chart */
      G.loopK++; const off=G.loopK*G.loopLen/G.spb;
      G.notes.push(...G.baseChart.map(n=>({beat:n.beat+off,mv:n.mv,lane:n.lane,st:0})));
    }
    if(G.state==='play'&&G.free&&G.loopLen){ const lap=Math.floor((ac.currentTime-(G.start-G.track.phase-G.track.lead*G.spb))/G.loopLen);
      if(lap>(G.lapShown||0)){ G.lapShown=lap; addText('Круг '+(lap+1),'#ffffff',3); } }
    if(G.state==='play'&&G.meter>=100&&!G.goldArmed&&!superActive(bp)) armGold();
    if(G.state==='play'&&ac.currentTime>G.end) finish(false);
  }

  if(G.state!=='pause'){
    updatePose(dt,t);
    for(const tx of G.texts) tx.life+=dt; G.texts=G.texts.filter(x=>x.life<x.max);
    for(const p of G.sparks){p.life+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;} G.sparks=G.sparks.filter(p=>p.life<p.max);
    for(const p of G.trail) p.life+=dt; G.trail=G.trail.filter(p=>p.life<0.35);
    G.flash*=Math.pow(0.02,dt); G.burst=Math.max(0,G.burst-dt*0.8);
  }
  draw(t); updateHUD();
  requestAnimationFrame(frame);
}
window.addEventListener('resize',resize);
renderMenu(); resize();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(buildBg);
requestAnimationFrame(frame);
})();
</script>
